<svg width="200" height="250" xmlns="http://www.w3.org/2000/svg">
  <!-- Potence -->
  <line x1="20" y1="230" x2="180" y2="230" stroke="black" stroke-width="4"/>
  <line x1="50" y1="230" x2="50" y2="20" stroke="black" stroke-width="4"/>
  <line x1="50" y1="20" x2="130" y2="20" stroke="black" stroke-width="4"/>
  <line x1="130" y1="20" x2="130" y2="50" stroke="black" stroke-width="4"/>
  <!-- Tête avec visage triste -->
  <circle cx="130" cy="70" r="20" stroke="#ff69b4" stroke-width="3" fill="#ffb6c1"/>
  <!-- Yeux tristes -->
  <circle cx="122" cy="65" r="2" fill="black"/>
  <circle cx="138" cy="65" r="2" fill="black"/>
  <!-- Bouche triste -->
  <path d="M 120 78 Q 130 73 140 78" stroke="black" stroke-width="2" fill="none"/>
  <!-- Corps -->
  <line x1="130" y1="90" x2="130" y2="150" stroke="#ff69b4" stroke-width="3"/>
  <!-- Bras gauche -->
  <line x1="130" y1="100" x2="100" y2="120" stroke="#ff69b4" stroke-width="3"/>
  <!-- Bras droit -->
  <line x1="130" y1="100" x2="160" y2="120" stroke="#ff69b4" stroke-width="3"/>
  <!-- Jambe gauche -->
  <line x1="130" y1="150" x2="110" y2="190" stroke="#ff69b4" stroke-width="3"/>
  <!-- Jambe droite -->
  <line x1="130" y1="150" x2="150" y2="190" stroke="#ff69b4" stroke-width="3"/>
</svg>

